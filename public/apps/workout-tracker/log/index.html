<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Log a workout</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--ink:#172d36;--muted:#596b73;--line:#dce3e7;--accent:#ff5c1a;--accent-dark:#e0470c;--accent2:#1ec4ae;--accent-tint:#fff1e9;--red:#c02f2f;--red-tint:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:#f3f6f8;color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:44px 24px 80px}
header{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--accent2)) 1;padding-bottom:20px;margin-bottom:28px}
h1{font-size:clamp(1.7rem,5vw,2.2rem);letter-spacing:-.04em;margin:0}
header p{color:var(--muted);font-size:.95rem;margin:8px 0 0}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:20px}
.back-link:hover{color:var(--accent-dark)}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
h2{font-size:1.05rem;margin:0 0 14px}
.hint{font-size:.82rem;color:var(--muted);margin:0 0 14px}
label{display:block;margin:16px 0 6px;font-weight:650;font-size:.88rem}
label:first-of-type{margin-top:0}
input,select{width:100%;min-width:0;font:inherit;background:white;border:1px solid #becbd3;border-radius:8px;color:var(--ink);padding:10px 12px}
input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
code{background:var(--accent-tint);padding:1px 5px;border-radius:4px;font-size:.85em}
.exercise-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.exercise-row .ex-header{display:flex;gap:8px}
.exercise-row .ex-name{flex:2}
.exercise-row .ex-sets-count{flex:1}
.exercise-row .ex-name-new{margin-top:8px}
.exercise-row .ex-remove{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);width:38px;flex:none;padding:0;font-weight:700}
.exercise-row .ex-remove:hover{border-color:var(--red);color:var(--red)}
.set-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:8px}
.set-row .set-num{font-size:.78rem;color:var(--muted);width:16px;flex:none}
.set-row .set-weight{flex:1}
.set-row .set-reps{flex:1}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.checkbox-row input{width:auto}
.checkbox-row label{margin:0;font-weight:600;font-size:.88rem}
button{font:inherit;font-weight:700;border:none;border-radius:999px;padding:11px 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark)}
.btn-block{width:100%;margin-top:18px}
.btn-link{background:none;border:none;color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:underline;padding:0;cursor:pointer}
.btn-link:hover{color:var(--accent-dark)}
.warning{background:var(--red-tint);color:var(--red);border-radius:10px;padding:11px 14px;font-size:.85rem;font-weight:600;margin-top:14px}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.85rem;color:var(--muted)}
ul.recent{list-style:none;margin:0;padding:0}
ul.recent li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0f2;font-size:.85rem}
ul.recent li:first-child{border-top:none}
ul.recent li button{background:none;border:none;color:var(--muted);font-weight:600;font-size:.78rem;cursor:pointer}
ul.recent li button:hover{color:var(--red)}
[hidden]{display:none!important}
</style>
</head>
<body><main>
<a class="back-link" href="../">&larr; Workout Tracker</a>
<header>
<h1>Log a workout</h1>
<p>Sign in to add entries. The calendar page reads whatever's saved here.</p>
</header>

<section id="loginSection" class="card">
<h2>Sign in</h2>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password">
<div id="loginWarning" class="warning" hidden></div>
<button type="button" id="loginBtn" class="btn-primary btn-block">Sign in</button>
</section>

<section id="appSection" hidden>
<div class="who">
<span id="whoami"></span>
<button type="button" id="logoutBtn" class="btn-link">Sign out</button>
</div>

<div class="card">
<h2>Load a plan</h2>
<p class="hint" id="planDescription"></p>
<div id="planWarning" class="warning" hidden></div>
<button type="button" id="loadPlanBtn" class="btn-primary btn-block">Load/fix cut plan (Sep 10 – Sep 29)</button>
</div>

<div class="card">
<h2>Add a workout</h2>
<label for="wDate">Date</label>
<input id="wDate" type="date">
<div class="row">
<div><label for="wType">Type</label>
<select id="wType">
<option value="strength">Strength</option>
<option value="cardio">Cardio</option>
<option value="other">Other</option>
</select></div>
<div><label for="wTitle">Title</label>
<select id="wTitle"><option value="">Select…</option><option value="__new__">+ New title…</option></select>
<input id="wTitleNew" type="text" placeholder="New title" hidden style="margin-top:8px"></div>
</div>
<label for="wDetail">Detail (optional)</label>
<input id="wDetail" type="text" placeholder="12% incline, 30 min, 3 mph">
<label>Exercises (optional)</label>
<div id="exerciseRows"></div>
<button type="button" id="addExerciseRowBtn" class="btn-link">+ Add exercise</button>
<div class="checkbox-row">
<input id="wCompleted" type="checkbox" checked>
<label for="wCompleted">Already done (uncheck if just planned)</label>
</div>
<p class="hint" id="mergeHint" hidden></p>
<div id="workoutWarning" class="warning" hidden></div>
<button type="button" id="addWorkoutBtn" class="btn-primary btn-block">Add workout</button>
</div>

<div class="card">
<h2>Recent workouts</h2>
<ul class="recent" id="recentWorkouts"></ul>
</div>

<div class="card">
<h2>Log today's weight</h2>
<label for="wgtDate">Date</label>
<input id="wgtDate" type="date">
<label for="wgtValue">Weight (lbs)</label>
<input id="wgtValue" type="number" inputmode="decimal" step="0.1" min="0" placeholder="172.4">
<div id="weightWarning" class="warning" hidden></div>
<button type="button" id="addWeightBtn" class="btn-primary btn-block">Save weight</button>
</div>

<div class="card">
<h2>Recent weigh-ins</h2>
<ul class="recent" id="recentWeights"></ul>
</div>

<div class="card">
<h2>Goal</h2>
<div class="row">
<div><label for="goalStart">Starting weight</label><input id="goalStart" type="number" inputmode="decimal" step="0.1" min="0"></div>
<div><label for="goalTarget">Target weight</label><input id="goalTarget" type="number" inputmode="decimal" step="0.1" min="0"></div>
</div>
<label for="goalDate">Target date</label>
<input id="goalDate" type="date">
<div id="goalWarning" class="warning" hidden></div>
<button type="button" id="saveGoalBtn" class="btn-primary btn-block">Save goal</button>
</div>
</section>
</main>
<script>
const SUPABASE_URL = 'https://qryyufmmdwybbjtugbhk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyeXl1Zm1tZHd5YmJqdHVnYmhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MjgwNDUsImV4cCI6MjEwNDUwNDA0NX0.PgYvgGCrXWIYRFa09gAE41w3-QCLs7Gcdwt5oxAwo_I';
const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY');
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const fmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

// Cut plan for Sep 10 – Sep 30. Sep 9 was the real start (Push, logged
// manually via the form below, not part of this bulk plan). Strict 3-day
// Push -> Pull -> Cardio rotation (~72h between same muscle group), moderate
// volume since frequency is already high. Sep 25-27 is a Denver golf trip:
// band/cable Push and Pull sessions instead of gym lifts, golf logged
// alongside (cart golf isn't a cardio substitute), altitude-aware easy
// cardio. Sep 28-30 tapers sodium/carbs (normal water) into the weigh-in;
// Sep 30 itself carries no training, just the morning weigh-in.
const WALK = '12% incline, 30 min, 3 mph';
const WALK_TAPER = '12% incline, 30 min, 3 mph — taper: lower sodium/carbs, keep water normal';
const RECOVERY_WALK = '30-40 min easy incline walk, normal step target';
const DENVER_CARDIO = '20-30 min conversational pace at altitude — walk preferred over running, keep it truly easy';
const FINAL_TAPER_WALK = "20-30 min easy incline walk, normal steps — taper: lower sodium/carbs, keep water normal, don't chase exhaustion";
const LIFT_VOL = '3 main movements x 3 sets, ~1-2 reps in reserve';
const GYM_PUSH = { type: 'strength', title: 'Chest/Shoulders/Triceps', detail: LIFT_VOL };
const GYM_PULL = { type: 'strength', title: 'Back/Biceps', detail: LIFT_VOL };
const BAND_PUSH = { type: 'strength', title: 'Chest/Shoulders/Triceps (bands)', detail: 'Door press, band overhead press, lateral raises, band tricep pushdowns — 3-4 sets x 8-20 reps' };
const BAND_PULL = { type: 'strength', title: 'Back/Biceps (bands)', detail: 'Band lat pulldown, rows, face pulls, band curls — 3-4 sets x 8-20 reps' };
const GOLF = { type: 'other', title: 'Golf', detail: 'Riding cart — not a cardio replacement' };
const ABS = { type: 'other', title: 'Abs', detail: 'Hanging leg raises 3x12-15, cable crunch 3x15, plank 3x45-60s' };
function walk(detail) { return { type: 'cardio', title: 'Incline walk', detail }; }
function recoveryWalk() { return { type: 'cardio', title: 'Incline walk (recovery)', detail: RECOVERY_WALK }; }
function denverCardio() { return { type: 'cardio', title: 'Easy cardio (Denver altitude)', detail: DENVER_CARDIO }; }
function finalTaperWalk() { return { type: 'cardio', title: 'Easy incline walk', detail: FINAL_TAPER_WALK }; }

// Every day (except Sep 30, intentionally training-free before the weigh-in)
// gets an ABS finisher appended — low fatigue cost either way.
const PLAN_START = '2026-09-10';
const PLAN_END = '2026-09-30';
const PLAN = [
  ['2026-09-10', [GYM_PULL, walk(WALK), ABS]],
  ['2026-09-11', [recoveryWalk(), ABS]],
  ['2026-09-12', [GYM_PUSH, walk(WALK), ABS]],
  ['2026-09-13', [GYM_PULL, walk(WALK), ABS]],
  ['2026-09-14', [recoveryWalk(), ABS]],
  ['2026-09-15', [GYM_PUSH, walk(WALK), ABS]],
  ['2026-09-16', [GYM_PULL, walk(WALK), ABS]],
  ['2026-09-17', [recoveryWalk(), ABS]],
  ['2026-09-18', [GYM_PUSH, walk(WALK), ABS]],
  ['2026-09-19', [GYM_PULL, walk(WALK), ABS]],
  ['2026-09-20', [recoveryWalk(), ABS]],
  ['2026-09-21', [GYM_PUSH, walk(WALK), ABS]],
  ['2026-09-22', [GYM_PULL, walk(WALK), ABS]],
  ['2026-09-23', [recoveryWalk(), ABS]],
  ['2026-09-24', [GYM_PUSH, walk(WALK), ABS]],
  ['2026-09-25', [BAND_PULL, GOLF, ABS]],
  ['2026-09-26', [denverCardio(), GOLF, ABS]],
  ['2026-09-27', [BAND_PUSH, GOLF, ABS]],
  ['2026-09-28', [GYM_PULL, walk(WALK_TAPER), ABS]],
  ['2026-09-29', [finalTaperWalk(), ABS]],
];
const PLAN_TOTAL = PLAN.reduce((n, [, entries]) => n + entries.length, 0);

const els = {
  login: document.getElementById('loginSection'),
  app: document.getElementById('appSection'),
};

function showError(id, message) {
  const el = document.getElementById(id);
  el.hidden = false;
  el.textContent = message;
}
function clearError(id) {
  document.getElementById(id).hidden = true;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  clearError('loginWarning');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showError('loginWarning', error.message);
    return;
  }
  await enterApp();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  els.app.hidden = true;
  els.login.hidden = false;
});

document.getElementById('loadPlanBtn').addEventListener('click', async () => {
  clearError('planWarning');
  const btn = document.getElementById('loadPlanBtn');
  btn.disabled = true;
  try {
    // Clear out stale not-yet-done planned entries in range first (e.g. from
    // an earlier version of this plan) — anything already marked done is
    // left alone, since it reflects something that actually happened.
    const { error: deleteErr } = await sb.from('workouts').delete()
      .gte('date', PLAN_START).lte('date', PLAN_END).eq('completed', false);
    if (deleteErr) throw deleteErr;

    const { data: existing, error: fetchErr } = await sb.from('workouts').select('date,title').gte('date', PLAN_START).lte('date', PLAN_END);
    if (fetchErr) throw fetchErr;
    const existingKeys = new Set((existing || []).map((w) => w.date + '|' + w.title));

    const rows = [];
    for (const [date, entries] of PLAN) {
      for (const entry of entries) {
        if (existingKeys.has(date + '|' + entry.title)) continue;
        rows.push({ date, type: entry.type, title: entry.title, detail: entry.detail, completed: false });
      }
    }
    if (rows.length === 0) {
      showError('planWarning', 'Already loaded — every planned entry for Sep 10–29 already exists.');
      return;
    }
    const { error: insertErr } = await sb.from('workouts').insert(rows);
    if (insertErr) throw insertErr;
    const skipped = PLAN_TOTAL - rows.length;
    document.getElementById('planDescription').textContent =
      `Cleared stale planned entries and loaded ${rows.length} fresh one${rows.length === 1 ? '' : 's'}${skipped ? ` (${skipped} already-completed entries kept as-is)` : ''}. Safe to click again — it won't duplicate or touch anything marked done.`;
    await refreshKnownLists();
    await loadRecentWorkouts();
  } catch (err) {
    showError('planWarning', err.message || String(err));
  } finally {
    btn.disabled = false;
  }
});

async function enterApp() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  document.getElementById('whoami').textContent = 'Signed in as ' + user.email;
  els.login.hidden = true;
  els.app.hidden = false;
  document.getElementById('planDescription').textContent =
    `${PLAN_TOTAL} planned entries, Sep 10–29 (continuing from your Sep 9 Push day): 3-day Push/Pull/Cardio rotation, Denver band workouts Sep 25-27, taper from Sep 28. Clears stale not-yet-done entries first, then reloads — anything already marked done is left untouched.`;
  document.getElementById('wDate').value = todayISO();
  document.getElementById('wgtDate').value = todayISO();
  await refreshKnownLists();
  await Promise.all([loadRecentWorkouts(), loadRecentWeights(), loadGoal()]);
}

let editingWorkoutId = null;
let knownTitles = [];
let knownExerciseNames = [];
const SETS_COUNT_OPTIONS = [1, 2, 3, 4, 5, 6, 7, 8];
const REPS_OPTIONS = Array.from({ length: 30 }, (_, i) => i + 1);

async function refreshKnownLists() {
  const { data } = await sb.from('workouts').select('title, exercises');
  const titles = new Set();
  const names = new Set();
  (data || []).forEach((w) => {
    if (w.title) titles.add(w.title);
    (w.exercises || []).forEach((ex) => { if (ex.name) names.add(ex.name); });
  });
  knownTitles = [...titles].sort();
  knownExerciseNames = [...names].sort();
  populateSelect(document.getElementById('wTitle'), knownTitles, document.getElementById('wTitle').value);
}

function populateSelect(select, options, keepValue) {
  select.replaceChildren();
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = 'Select…';
  select.append(blank);
  options.forEach((opt) => {
    const el = document.createElement('option');
    el.value = opt;
    el.textContent = opt;
    select.append(el);
  });
  const newOpt = document.createElement('option');
  newOpt.value = '__new__';
  newOpt.textContent = '+ New…';
  select.append(newOpt);
  if (keepValue && options.includes(keepValue)) select.value = keepValue;
}

function wireNewToggle(select, newInput) {
  select.addEventListener('change', () => {
    newInput.hidden = select.value !== '__new__';
    if (!newInput.hidden) newInput.focus();
  });
}
wireNewToggle(document.getElementById('wTitle'), document.getElementById('wTitleNew'));

function selectedOrNewValue(select, newInput) {
  return select.value === '__new__' ? newInput.value.trim() : select.value;
}

function renderSetRows(container, count, existingSets = []) {
  container.replaceChildren();
  for (let i = 0; i < count; i++) {
    const existing = existingSets[i];
    const row = document.createElement('div');
    row.className = 'set-row';
    const num = document.createElement('span');
    num.className = 'set-num';
    num.textContent = i + 1;
    const weight = document.createElement('input');
    weight.className = 'set-weight';
    weight.type = 'text';
    weight.placeholder = '185 or BW+25';
    weight.value = existing ? existing.weight : '';
    const reps = document.createElement('select');
    reps.className = 'set-reps';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = 'Reps';
    reps.append(blank);
    REPS_OPTIONS.forEach((r) => {
      const o = document.createElement('option');
      o.value = r;
      o.textContent = r;
      reps.append(o);
    });
    if (existing?.reps != null) reps.value = existing.reps;
    row.append(num, weight, reps);
    container.append(row);
  }
}

function addExerciseRow(name = '', sets = []) {
  const row = document.createElement('div');
  row.className = 'exercise-row';

  const header = document.createElement('div');
  header.className = 'ex-header';
  const nameSelect = document.createElement('select');
  nameSelect.className = 'ex-name';
  const setsCount = document.createElement('select');
  setsCount.className = 'ex-sets-count';
  SETS_COUNT_OPTIONS.forEach((n) => {
    const o = document.createElement('option');
    o.value = n;
    o.textContent = `${n} set${n === 1 ? '' : 's'}`;
    setsCount.append(o);
  });
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'ex-remove';
  removeBtn.textContent = '×';
  removeBtn.addEventListener('click', () => row.remove());
  header.append(nameSelect, setsCount, removeBtn);

  const nameNew = document.createElement('input');
  nameNew.className = 'ex-name-new';
  nameNew.type = 'text';
  nameNew.placeholder = 'New exercise name';
  nameNew.hidden = true;

  const setRows = document.createElement('div');
  setRows.className = 'set-rows';

  populateSelect(nameSelect, knownExerciseNames, name);
  if (name && !knownExerciseNames.includes(name)) {
    nameSelect.value = '__new__';
    nameNew.hidden = false;
    nameNew.value = name;
  }
  wireNewToggle(nameSelect, nameNew);

  const initialCount = Math.max(1, sets.length || 3);
  setsCount.value = String(Math.min(initialCount, SETS_COUNT_OPTIONS[SETS_COUNT_OPTIONS.length - 1]));
  renderSetRows(setRows, Number(setsCount.value), sets);
  setsCount.addEventListener('change', () => renderSetRows(setRows, Number(setsCount.value)));

  row.append(header, nameNew, setRows);
  document.getElementById('exerciseRows').append(row);
}

function collectExercises() {
  return [...document.querySelectorAll('#exerciseRows .exercise-row')]
    .map((row) => {
      const name = selectedOrNewValue(row.querySelector('.ex-name'), row.querySelector('.ex-name-new'));
      const sets = [...row.querySelectorAll('.set-row')]
        .map((setRow) => ({
          weight: setRow.querySelector('.set-weight').value.trim(),
          reps: setRow.querySelector('.set-reps').value ? Number(setRow.querySelector('.set-reps').value) : null,
        }))
        .filter((s) => s.weight);
      return { name, sets };
    })
    .filter((ex) => ex.name);
}

function resetWorkoutForm() {
  editingWorkoutId = null;
  document.getElementById('wTitle').value = '';
  document.getElementById('wTitleNew').hidden = true;
  document.getElementById('wTitleNew').value = '';
  document.getElementById('wDetail').value = '';
  document.getElementById('wCompleted').checked = true;
  document.getElementById('exerciseRows').replaceChildren();
  document.getElementById('addWorkoutBtn').textContent = 'Add workout';
  document.getElementById('mergeHint').hidden = true;
}

function loadWorkoutIntoForm(w) {
  editingWorkoutId = w.id;
  document.getElementById('wDate').value = w.date;
  document.getElementById('wType').value = w.type;
  const titleSelect = document.getElementById('wTitle');
  const titleNew = document.getElementById('wTitleNew');
  populateSelect(titleSelect, knownTitles, w.title);
  if (!knownTitles.includes(w.title)) {
    titleSelect.value = '__new__';
    titleNew.hidden = false;
    titleNew.value = w.title;
  } else {
    titleNew.hidden = true;
  }
  document.getElementById('wDetail').value = w.detail || '';
  document.getElementById('wCompleted').checked = w.completed;
  document.getElementById('exerciseRows').replaceChildren();
  (w.exercises || []).forEach((ex) => addExerciseRow(ex.name, ex.sets));
  if ((w.exercises || []).length === 0) addExerciseRow();
  document.getElementById('addWorkoutBtn').textContent = 'Update workout';
  const hint = document.getElementById('mergeHint');
  hint.hidden = false;
  hint.textContent = `Editing the existing ${fmt.format(new Date(w.date + 'T00:00:00'))} "${w.title}" entry — saving updates it, doesn't duplicate it.`;
  document.getElementById('wTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('addExerciseRowBtn').addEventListener('click', () => addExerciseRow());

async function loadRecentWorkouts() {
  // Sorted by closeness to today (not just most-future-first) so a bulk plan
  // full of far-future dates doesn't bury what's actually near-term relevant.
  const { data: all } = await sb.from('workouts').select('*');
  const today = todayISO();
  const data = (all || [])
    .sort((a, b) => Math.abs(daysBetween(today, a.date)) - Math.abs(daysBetween(today, b.date)))
    .slice(0, 15);
  const list = document.getElementById('recentWorkouts');
  list.replaceChildren();
  (data || []).forEach((w) => {
    const li = document.createElement('li');
    const label = document.createElement('span');
    const exCount = (w.exercises || []).length;
    label.textContent = `${fmt.format(new Date(w.date + 'T00:00:00'))} — ${w.title}${w.completed ? '' : ' (planned)'}${exCount ? ` · ${exCount} exercise${exCount === 1 ? '' : 's'}` : ''}`;
    const actions = document.createElement('span');
    actions.style.display = 'flex';
    actions.style.gap = '10px';
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.textContent = 'Edit';
    edit.addEventListener('click', () => loadWorkoutIntoForm(w));
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', async () => {
      await sb.from('workouts').delete().eq('id', w.id);
      if (editingWorkoutId === w.id) resetWorkoutForm();
      loadRecentWorkouts();
    });
    actions.append(edit, del);
    li.append(label, actions);
    list.append(li);
  });
}

async function loadRecentWeights() {
  const { data } = await sb.from('weight_entries').select('*').order('date', { ascending: false }).limit(10);
  const list = document.getElementById('recentWeights');
  list.replaceChildren();
  (data || []).forEach((w) => {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = `${fmt.format(new Date(w.date + 'T00:00:00'))} — ${Number(w.weight).toFixed(1)} lbs`;
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', async () => {
      await sb.from('weight_entries').delete().eq('id', w.id);
      loadRecentWeights();
    });
    li.append(label, del);
    list.append(li);
  });
}

async function loadGoal() {
  const { data } = await sb.from('goal').select('*').eq('id', 'default').maybeSingle();
  if (!data) return;
  document.getElementById('goalStart').value = data.start_weight;
  document.getElementById('goalTarget').value = data.target_weight;
  document.getElementById('goalDate').value = data.target_date;
}

document.getElementById('addWorkoutBtn').addEventListener('click', async () => {
  clearError('workoutWarning');
  const date = document.getElementById('wDate').value;
  const type = document.getElementById('wType').value;
  const title = selectedOrNewValue(document.getElementById('wTitle'), document.getElementById('wTitleNew'));
  const detail = document.getElementById('wDetail').value.trim();
  const completed = document.getElementById('wCompleted').checked;
  const exercises = collectExercises();
  if (!date || !title) {
    showError('workoutWarning', 'Date and title are required.');
    return;
  }

  if (editingWorkoutId) {
    const { error } = await sb.from('workouts').update({ type, title, detail, completed, exercises }).eq('id', editingWorkoutId);
    if (error) { showError('workoutWarning', error.message); return; }
    resetWorkoutForm();
    await refreshKnownLists();
    await loadRecentWorkouts();
    return;
  }

  // No explicit edit in progress — but if a matching date+title already
  // exists (e.g. a planned entry from the bulk plan), update that instead
  // of creating a duplicate row for the same session.
  const { data: existing } = await sb.from('workouts').select('id').eq('date', date).eq('title', title).maybeSingle();
  if (existing) {
    const { error } = await sb.from('workouts').update({ type, detail, completed, exercises }).eq('id', existing.id);
    if (error) { showError('workoutWarning', error.message); return; }
  } else {
    const { error } = await sb.from('workouts').insert({ date, type, title, detail, completed, exercises });
    if (error) { showError('workoutWarning', error.message); return; }
  }
  resetWorkoutForm();
  await refreshKnownLists();
  await loadRecentWorkouts();
});

document.getElementById('addWeightBtn').addEventListener('click', async () => {
  clearError('weightWarning');
  const date = document.getElementById('wgtDate').value;
  const weight = Number(document.getElementById('wgtValue').value);
  if (!date || !Number.isFinite(weight) || weight <= 0) {
    showError('weightWarning', 'Enter a date and a weight greater than zero.');
    return;
  }
  const { error } = await sb.from('weight_entries').upsert({ date, weight }, { onConflict: 'date' });
  if (error) {
    showError('weightWarning', error.message);
    return;
  }
  document.getElementById('wgtValue').value = '';
  await loadRecentWeights();
});

document.getElementById('saveGoalBtn').addEventListener('click', async () => {
  clearError('goalWarning');
  const start_weight = Number(document.getElementById('goalStart').value);
  const target_weight = Number(document.getElementById('goalTarget').value);
  const target_date = document.getElementById('goalDate').value;
  if (!Number.isFinite(start_weight) || !Number.isFinite(target_weight) || !target_date) {
    showError('goalWarning', 'Fill in starting weight, target weight, and target date.');
    return;
  }
  const { error } = await sb.from('goal').upsert({ id: 'default', start_weight, target_weight, target_date });
  if (error) showError('goalWarning', error.message);
});

async function init() {
  if (!configured) {
    document.querySelector('main').insertAdjacentHTML('afterbegin', '<div class="warning">Supabase not configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in this file.</div>');
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp();
}
init();
</script>
</body></html>
